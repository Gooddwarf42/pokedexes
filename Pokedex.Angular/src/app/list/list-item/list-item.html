<div class="grid grid-cols-1 md:grid-cols-3 hover:bg-slate-50 transition-colors">
  <div class="flex flex-col md:block px-6 py-4 md:border-r md:border-slate-100">
    <span class="text-[10px] uppercase font-bold text-slate-400 md:hidden">Number</span>
    <span class="font-medium text-slate-900">#{{ data().number }}</span>
  </div>

  <div class="flex flex-col md:block px-6 py-4 md:border-r md:border-slate-100">
    <span class="text-[10px] uppercase font-bold text-slate-400 md:hidden">Name</span>
    <span class="text-slate-700">{{ data().name }}</span>
  </div>

  <div class="flex flex-col md:block px-6 py-4">
    <span class="text-[10px] uppercase font-bold text-slate-400 md:hidden">Address</span>
    <span class="text-sm text-slate-500 italic">{{ data().address }}</span>
  </div>
</div>
