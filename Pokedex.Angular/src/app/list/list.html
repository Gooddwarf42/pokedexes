<div
  class="max-w-4xl mx-auto my-4 md:my-8 overflow-hidden bg-white md:border md:border-slate-200 md:rounded-xl md:shadow-sm"
>
  <div
    class="hidden md:grid grid-cols-3 bg-slate-50 border-b border-slate-200 text-sm font-semibold text-slate-700 uppercase tracking-wider"
  >
    <span
      class="cursor-pointer hover:bg-slate-100 px-6 py-4 border-r border-slate-200 flex items-center justify-between group"
      (click)="updateColumnSort('Number')"
    >
      Number
      @if (sortInfo().columnName === 'Number') {
        <svg
          [class.rotate-180]="sortInfo().sortedDesc"
          class="w-4 h-4 text-slate-500 transition-transform duration-200"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      }
    </span>
    <span
      class="cursor-pointer hover:bg-slate-100 px-6 py-4 border-r border-slate-200 flex items-center justify-between group"
      (click)="updateColumnSort('Name')"
      >Name
      @if (sortInfo().columnName === 'Name') {
        <svg
          [class.rotate-180]="sortInfo().sortedDesc"
          class="w-4 h-4 text-slate-500 transition-transform duration-200"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      }
    </span>
    <span
      class="cursor-pointer hover:bg-slate-100 px-6 py-4 flex items-center justify-between group"
      (click)="updateColumnSort('Address')"
      >Address

      @if (sortInfo().columnName === 'Address') {
        <svg
          [class.rotate-180]="sortInfo().sortedDesc"
          class="w-4 h-4 text-slate-500 transition-transform duration-200"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      }
    </span>
  </div>

  <div class="divide-y divide-slate-100">
    @for (item of dataToShow(); track $index) {
      <app-list-item [data]="item"></app-list-item>
    } @empty {
      <div class="p-8 text-center text-slate-400">No items found.</div>
    }
  </div>
</div>
